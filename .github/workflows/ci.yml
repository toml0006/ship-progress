name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Watch-only guard (AC12)
        run: scripts/check-watch-only.sh
      - name: Public-repo guard
        run: scripts/check-public.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.302
      - name: Validate the plugin
        run: claude plugin validate .
      - name: Test
        run: claude plugin test .
